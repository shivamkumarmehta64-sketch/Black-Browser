<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#1c1c1e;color:#e0e0e0;display:flex;flex-direction:column;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
#bar{display:flex;align-items:center;gap:4px;padding:4px 8px;background:rgba(30,30,32,0.96);border-bottom:1px solid #3a3a3c;flex-shrink:0;backdrop-filter:blur(12px);-webkit-app-region:drag}
#bar>*{-webkit-app-region:no-drag}
#bar button{background:transparent;border:none;color:#8e8e93;width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:15px;transition:all .12s ease;display:flex;align-items:center;justify-content:center}
#bar button:hover{background:rgba(255,255,255,0.08);color:#fff}
#bar button:disabled{opacity:.18;cursor:default;transform:none}
#bar button:active:not(:disabled){transform:scale(.92)}
#url-bar{flex:1;height:30px;padding:0 10px;border:1px solid #3a3a3c;border-radius:6px;background:#2c2c2e;color:#e0e0e0;font-size:12.5px;outline:none;transition:border .12s ease,box-shadow .12s ease}
#url-bar:focus{border-color:#0a84ff;box-shadow:0 0 0 2px rgba(10,132,255,0.2)}
#url-bar::placeholder{color:#636366}
#shield-btn{position:relative;width:auto!important;padding:0 8px;gap:4px;font-size:11px;color:#30d158!important}
#shield-btn .shield-count{font-variant-numeric:tabular-nums;min-width:14px}
#loading-bar{position:absolute;top:0;left:0;height:2px;background:#0a84ff;width:0;transition:width .3s ease;z-index:100;opacity:0}
#loading-bar.active{opacity:1}
#ntp{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;overflow:auto;padding:40px;background:linear-gradient(135deg,rgba(28,28,30,0.94),rgba(36,36,38,0.9),rgba(44,44,46,0.86)),var(--bg) center/cover fixed;animation:fadeIn .3s ease}
#ntp .logo{width:72px;height:72px;margin-bottom:10px;border-radius:14px;transition:transform .2s ease}
#ntp .logo:hover{transform:scale(1.04)}
#ntp h1{font-size:24px;margin-bottom:2px;color:#fff;font-weight:600;letter-spacing:1.5px}
#ntp .tagline{color:#8e8e93;margin-bottom:28px;font-size:12.5px}
#dials{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;max-width:500px;width:100%}
.dial{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px;border-radius:10px;background:rgba(255,255,255,0.04);cursor:pointer;transition:all .12s ease;text-decoration:none;color:#e0e0e0;user-select:none}
.dial:hover{background:rgba(255,255,255,0.09);transform:translateY(-1px)}
.dial:active{transform:scale(.96)}
.dial-icon{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;font-size:17px;color:#8e8e93;transition:transform .12s ease}
.dial:hover .dial-icon{transform:scale(1.05)}
.dial-label{font-size:10.5px;text-align:center;word-break:break-all;max-width:88px;color:#8e8e93;line-height:1.3}
#wallpaper-btn{position:fixed;bottom:16px;right:16px;background:rgba(255,255,255,0.06);border:1px solid #3a3a3c;color:#8e8e93;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;transition:all .2s ease;z-index:10;display:flex;align-items:center;justify-content:center}
#wallpaper-btn:hover{background:rgba(255,255,255,0.12);color:#fff;transform:rotate(30deg)}
#webview{flex:1;display:none;animation:fadeIn .15s ease}
#webview.active{display:block}
.hidden{display:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="loading-bar"></div>
<div id="bar">
  <button id="back-btn" disabled title="Back (Alt+Left)">&#x25C0;</button>
  <button id="fwd-btn" disabled title="Forward (Alt+Right)">&#x25B6;</button>
  <button id="reload-btn" title="Reload (Ctrl+R)">&#x21BB;</button>
  <input id="url-bar" type="text" placeholder="Search or enter URL..." spellcheck="false" autofocus>
  <button id="shield-btn" title="Ads & trackers blocked"><span class="shield-count">0</span> &#x1F6E1;</button>
</div>
<div id="ntp">
  <img class="logo" src="icon.png" alt="D">
  <h1>BLACK NOIR</h1>
  <p class="tagline">Private browser with ad blocking</p>
  <div id="dials"></div>
  <button id="wallpaper-btn">&#x1F5BC;</button>
</div>
<webview id="webview" allowpopups style="height:100%"></webview>
<script>
const $ = s => document.querySelector(s);
const webview = $('#webview');
const urlBar = $('#url-bar');
const backBtn = $('#back-btn');
const fwdBtn = $('#fwd-btn');
const reloadBtn = $('#reload-btn');
const ntp = $('#ntp');
const loadingBar = $('#loading-bar');
const shieldCount = $('.shield-count');

let currentUrl = 'about:blank';
let dials = [];
window._blockedCount = 0;
window._updateShield = function() { if (shieldCount) shieldCount.textContent = window._blockedCount || 0; };

var wallpapers = ['bg.jpg','bg2.jpg','bg3.jpg'];
var wpIdx = 0;
window.api.getConfig().then(cfg => {
  dials = cfg.dials || [
    {url:'https://google.com',label:'Google',icon:'G'},
    {url:'https://youtube.com',label:'YouTube',icon:'Y'},
    {url:'https://github.com',label:'GitHub',icon:'GH'},
    {url:'https://reddit.com',label:'Reddit',icon:'R'}
  ];
  renderDials();
  if (cfg.wallpaper != null) { wpIdx = cfg.wallpaper; setWallpaper(wpIdx); }
  window.api.getBlocked().then(function(n) { window._blockedCount = n || 0; _updateShield(); });
});
function setWallpaper(i) {
  wpIdx = i % wallpapers.length;
  ntp.style.setProperty('--bg', 'url(' + wallpapers[wpIdx] + ')');
  window.api.getConfig().then(function(cfg) { cfg.wallpaper = wpIdx; window.api.setConfig(cfg); });
}
$('#wallpaper-btn').onclick = function() { setWallpaper(wpIdx + 1); };

function renderDials() {
  $('#dials').innerHTML = dials.map(d =>
    `<div class="dial" data-url="${d.url}"><div class="dial-icon">${d.icon||'&#x1F310;'}</div><div class="dial-label">${d.label||d.url}</div></div>`
  ).join('');
  $('#dials').onclick = e => {
    const dial = e.target.closest('.dial');
    if (dial) navigateTo(dial.dataset.url);
  };
}

function navigateTo(url) {
  if (!url || url === 'about:blank') { showNtp(); return; }
  try { new URL(url); } catch { url = 'https://www.google.com/search?q=' + encodeURIComponent(url); }
  webview.src = url;
  webview.classList.add('active');
  ntp.classList.add('hidden');
  urlBar.value = url;
  currentUrl = url;
  loadingBar.classList.add('active');
}

function showNtp() {
  webview.classList.remove('active');
  ntp.classList.remove('hidden');
  webview.src = 'about:blank';
  urlBar.value = '';
  currentUrl = 'about:blank';
  loadingBar.classList.remove('active');
}

urlBar.addEventListener('keydown', e => {
  if (e.key === 'Enter') navigateTo(urlBar.value.trim());
});

var _yscr = "var _pk=['adPlacements','adSlots','playerAds','adBreakHeartbeatParams','frameworkUpdates','responseContext.adSignalsInfo','auxiliaryUi.messageRenderers.upsellDialogRenderer','promotedSparklesWebRenderer','promotedVideoRenderer','compactPromotedVideoRenderer','compactPromotedItemRenderer','backgroundPromoRenderer','statementBannerRenderer','brandVideoShelfRenderer','inlineAdLayoutRenderer','adSlotRenderer'];function _dn(o,p){var k=p.split('.'),c=o;for(var i=0;i<k.length-1;i++){if(!c||typeof c!=='object')return false;c=c[k[i]]}if(c&&typeof c==='object'){var l=k[k.length-1];if(l in c){delete c[l];return true}}return false}function _pr(o){if(!o||typeof o!=='object')return false;var p=false;for(var i=0;i<_pk.length;i++){if(_dn(o,_pk[i]))p=true}return p}JSON.parse=new Proxy(JSON.parse,{apply:function(t,a,r){var x=Reflect.apply(t,a,r);try{if(x&&typeof x==='object')_pr(x)}catch(e){}return x}});var _of=window.fetch;window.fetch=function(u,o){var u2=(typeof u==='string'?u:u&&u.url)||'';if(/\\/youtubei\\/v1\\/(player|browse|search|next|guide|get_watch|reel_watch_sequence)/.test(u2)){return _of.apply(this,arguments).then(function(r){return r.clone().text().then(function(t){try{var j=JSON.parse(t);if(_pr(j))r=new Response(JSON.stringify(j),{status:r.status,statusText:r.statusText,headers:r.headers})}catch(e){}return r}).catch(function(){return r})})}return _of.apply(this,arguments)};try{if(window.ytInitialPlayerResponse){_pr(window.ytInitialPlayerResponse);if(window.ytInitialData)_pr(window.ytInitialData)}}catch(e){}";
webview.addEventListener('did-start-loading', function() { loadingBar.classList.add('active'); reloadBtn.textContent = '\u2716'; });
webview.addEventListener('did-stop-loading', function() {
  loadingBar.classList.remove('active');
  reloadBtn.textContent = '\u21BB';
  if (/youtube\.com/i.test(webview.getURL())) webview.executeJavaScript(_yscr);
});
webview.addEventListener('did-navigate', function(e) { urlBar.value = e.url; currentUrl = e.url; });
webview.addEventListener('did-navigate-in-page', function(e) { urlBar.value = e.url; currentUrl = e.url; });
webview.addEventListener('page-title-updated', function(e) { document.title = e.title + ' - Black Noir'; });
webview.addEventListener('update-target-url', function(e) { if (e.url) urlBar.placeholder = e.url; });
webview.addEventListener('did-navigate', function() { backBtn.disabled = !webview.canGoBack(); fwdBtn.disabled = !webview.canGoForward(); });
webview.addEventListener('did-navigate-in-page', function() { backBtn.disabled = !webview.canGoBack(); fwdBtn.disabled = !webview.canGoForward(); });

backBtn.onclick = function() { webview.goBack(); };
fwdBtn.onclick = function() { webview.goForward(); };
reloadBtn.onclick = function() { if (webview.isLoading()) webview.stop(); else webview.reload(); };

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'l') { e.preventDefault(); urlBar.focus(); urlBar.select(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 't') { e.preventDefault(); showNtp(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'r') { e.preventDefault(); webview.reload(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'w') { e.preventDefault(); showNtp(); }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); webview.goBack(); }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); webview.goForward(); }
  if (e.key === 'F5') { e.preventDefault(); webview.reload(); }
  if (e.key === 'F11') { e.preventDefault(); const bv = require('electron').remote || null; if (bv) { const w = bv.getCurrentWindow(); w.setFullScreen(!w.isFullScreen()); } }
  if (e.key === 'Escape') { webview.stop(); }
});

urlBar.addEventListener('focus', function() { this.select(); });
</script>
</body>
</html>
