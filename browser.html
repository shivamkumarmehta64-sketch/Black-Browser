<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.4 system-ui,sans-serif;background:#0a0000;color:#ddd;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(15,0,0,0.95);border-bottom:1px solid #8B0000;flex-shrink:0;backdrop-filter:blur(4px)}
#bar button{background:rgba(139,0,0,0.3);border:1px solid #8B0000;color:#ff4444;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px;transition:all .2s}
#bar button:hover{background:#8B0000;color:#fff;box-shadow:0 0 10px #ff000066}
#bar button:disabled{opacity:.2;cursor:default;box-shadow:none}
#url-bar{flex:1;height:32px;padding:0 12px;border:1px solid #8B0000;border-radius:16px;background:rgba(0,0,0,0.8);color:#ff6666;font-size:13px;outline:none;transition:border .2s,box-shadow .2s}
#url-bar:focus{border-color:#ff0000;box-shadow:0 0 12px #ff000044}
#url-bar::placeholder{color:#4a0000}
#bookmark-btn{font-size:14px}
#ntp{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;overflow:auto;padding:40px;background:linear-gradient(135deg,rgba(10,0,0,0.92),rgba(30,0,0,0.9),rgba(50,0,0,0.88)),url('bg.jpg') center/cover fixed}
#ntp .logo{width:80px;height:80px;margin-bottom:12px;filter:drop-shadow(0 0 20px #ff000066)}
#ntp h1{font-size:32px;margin-bottom:4px;color:#ff4444;text-shadow:0 0 20px #ff000066,0 0 40px #8B0000;letter-spacing:4px;font-weight:900}
#ntp .tagline{color:#8B0000;margin-bottom:30px;font-style:italic;letter-spacing:2px;font-size:13px}
#dials{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px;max-width:600px;width:100%}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border-radius:12px;background:rgba(139,0,0,0.15);border:1px solid rgba(139,0,0,0.3);cursor:pointer;transition:all .3s;text-decoration:none;color:#ddd}
.dial:hover{background:rgba(139,0,0,0.35);border-color:#ff4444;box-shadow:0 0 15px #ff000033;transform:translateY(-2px)}
.dial-icon{width:48px;height:48px;border-radius:12px;background:rgba(139,0,0,0.4);border:1px solid #8B0000;display:flex;align-items:center;justify-content:center;font-size:20px;color:#ff6666}
.dial-label{font-size:11px;text-align:center;word-break:break-all;max-width:100px;color:#aa4444}
#webview{flex:1;display:none}
#webview.active{display:block}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="bar">
  <button id="back-btn" disabled>&#x25C0;</button>
  <button id="fwd-btn" disabled>&#x25B6;</button>
  <button id="reload-btn">&#x21BB;</button>
  <input id="url-bar" type="text" placeholder="Search or enter URL..." spellcheck="false" autofocus>
  <button id="bookmark-btn">&#x2606;</button>
</div>
<div id="ntp">
  <img class="logo" src="icon.png" alt="D">
  <h1>BLACK NOIR</h1>
  <p class="tagline">&#x2620; born in darkness &#x2620;</p>
  <div id="dials"></div>
</div>
<webview id="webview" allowpopups style="height:100%"></webview>
<script>
const $ = s => document.querySelector(s);
const webview = $('#webview');
const urlBar = $('#url-bar');
const backBtn = $('#back-btn');
const fwdBtn = $('#fwd-btn');
const reloadBtn = $('#reload-btn');
const ntp = $('#ntp');

let currentUrl = 'about:blank';
let dials = [];

window.api.getConfig().then(cfg => {
  dials = cfg.dials || [
    {url:'https://google.com',label:'Google',icon:'G'},
    {url:'https://youtube.com',label:'YouTube',icon:'Y'},
    {url:'https://github.com',label:'GitHub',icon:'GH'},
    {url:'https://reddit.com',label:'Reddit',icon:'R'}
  ];
  renderDials();
});

function renderDials() {
  $('#dials').innerHTML = dials.map(d =>
    `<div class="dial" data-url="${d.url}"><div class="dial-icon">${d.icon||'&#x1F310;'}</div><div class="dial-label">${d.label||d.url}</div></div>`
  ).join('');
  $('#dials').onclick = e => {
    const dial = e.target.closest('.dial');
    if (dial) navigateTo(dial.dataset.url);
  };
}

function navigateTo(url) {
  if (!url || url === 'about:blank') { showNtp(); return; }
  try { new URL(url); } catch { url = 'https://www.google.com/search?q=' + encodeURIComponent(url); }
  webview.src = url;
  webview.classList.add('active');
  ntp.classList.add('hidden');
  urlBar.value = url;
  currentUrl = url;
}

function showNtp() {
  webview.classList.remove('active');
  ntp.classList.remove('hidden');
  webview.src = 'about:blank';
  urlBar.value = '';
  currentUrl = 'about:blank';
}

urlBar.addEventListener('keydown', e => {
  if (e.key === 'Enter') navigateTo(urlBar.value.trim());
});

var _yscr = "var _pk=['adPlacements','adSlots','playerAds','adBreakHeartbeatParams','frameworkUpdates','responseContext.adSignalsInfo','auxiliaryUi.messageRenderers.upsellDialogRenderer','promotedSparklesWebRenderer','promotedVideoRenderer','compactPromotedVideoRenderer','compactPromotedItemRenderer','backgroundPromoRenderer','statementBannerRenderer','brandVideoShelfRenderer','inlineAdLayoutRenderer','adSlotRenderer'];function _dn(o,p){var k=p.split('.'),c=o;for(var i=0;i<k.length-1;i++){if(!c||typeof c!=='object')return false;c=c[k[i]]}if(c&&typeof c==='object'){var l=k[k.length-1];if(l in c){delete c[l];return true}}return false}function _pr(o){if(!o||typeof o!=='object')return false;var p=false;for(var i=0;i<_pk.length;i++){if(_dn(o,_pk[i]))p=true}return p}JSON.parse=new Proxy(JSON.parse,{apply:function(t,a,r){var x=Reflect.apply(t,a,r);try{if(x&&typeof x==='object')_pr(x)}catch(e){}return x}});var _of=window.fetch;window.fetch=function(u,o){var u2=(typeof u==='string'?u:u&&u.url)||'';if(/\\/youtubei\\/v1\\/(player|browse|search|next|guide|get_watch|reel_watch_sequence)/.test(u2)){return _of.apply(this,arguments).then(function(r){return r.clone().text().then(function(t){try{var j=JSON.parse(t);if(_pr(j))r=new Response(JSON.stringify(j),{status:r.status,statusText:r.statusText,headers:r.headers})}catch(e){}return r}).catch(function(){return r})})}return _of.apply(this,arguments)};try{if(window.ytInitialPlayerResponse){_pr(window.ytInitialPlayerResponse);if(window.ytInitialData)_pr(window.ytInitialData)}}catch(e){}";
webview.addEventListener('did-stop-loading', () => {
  reloadBtn.textContent = '\u21BB';
  if (/youtube\.com/i.test(webview.getURL())) webview.executeJavaScript(_yscr);
});
webview.addEventListener('did-navigate', (e) => { urlBar.value = e.url; currentUrl = e.url; });
webview.addEventListener('did-navigate-in-page', (e) => { urlBar.value = e.url; currentUrl = e.url; });
webview.addEventListener('page-title-updated', (e) => { document.title = e.title + ' - Black Noir'; });
webview.addEventListener('update-target-url', (e) => { if (e.url) urlBar.placeholder = e.url; });
webview.addEventListener('did-navigate', () => {
  backBtn.disabled = !webview.canGoBack();
  fwdBtn.disabled = !webview.canGoForward();
});
webview.addEventListener('did-navigate-in-page', () => {
  backBtn.disabled = !webview.canGoBack();
  fwdBtn.disabled = !webview.canGoForward();
});

backBtn.onclick = () => webview.goBack();
fwdBtn.onclick = () => webview.goForward();
reloadBtn.onclick = () => {
  if (webview.isLoading()) webview.stop(); else webview.reload();
};

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'l') { e.preventDefault(); urlBar.focus(); urlBar.select(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 't') { e.preventDefault(); showNtp(); }
});
</script>
</body>
</html>
