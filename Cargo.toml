[package]
name = "black-noir"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "black-noir"
path = "src/main.rs"

[dependencies]
webview2-com = "0.38"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver"] }
url = "2"

windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
